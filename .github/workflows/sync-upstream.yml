name: Sync fork with upstream

on:
  schedule:
    - cron: "0 6 * * 1,3,5"   # Mon, Wed, Fri at 06:00 UTC
  workflow_dispatch:           # allows the workflow to be run manually

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Merge upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/mlc-ai/web-llm.git
          git fetch upstream main

          if git merge --ff-only upstream/main; then
            echo "Fast-forwarded."
          else
            echo "Can't fast-forward, doing a regular merge."
            git merge --no-edit upstream/main
          fi
          
          rm -f .github/workflows/build-site.yaml .github/workflows/tests.yaml
          
          git push origin HEAD:main
